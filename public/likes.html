<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIKES OVERLAY - TikTok</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --neon-color: #00f2ea;
            --neon-glow: rgba(0, 242, 234, 0.8);
            --hot-pink: #ff0050;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: transparent;
            color: #fff;
            font-family: "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 32px;
            box-sizing: border-box;
        }

        #likes-box {
            width: 380px;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            padding: 0;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 0;
            padding: 0;
            margin-bottom: 12px;
        }

        .title {
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0;
            text-transform: uppercase;
            text-shadow: 0 0 16px var(--neon-color);
        }

        #total-likes {
            font-size: 2.1rem;
            font-weight: 900;
            color: var(--hot-pink);
            text-shadow: 0 0 18px var(--hot-pink);
            line-height: 1;
        }

        #likes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .like-row {
            display: grid;
            grid-template-columns: 34px 50px 1fr auto;
            align-items: center;
            gap: 10px;
            min-height: 64px;
            padding: 8px;
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.62);
        }

        .rank {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--neon-color);
            color: #001;
            font-weight: 900;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #fff;
            object-fit: cover;
            background: #222;
        }

        .name {
            font-size: 0.95rem;
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .likes {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--hot-pink);
            text-shadow: 0 0 12px var(--hot-pink);
            white-space: nowrap;
        }

        #empty-state {
            margin-top: 70px;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 800;
        }

    </style>
</head>
<body>
    <main id="likes-box">
        <div class="header">
            <div>
                <div class="title">Top likes</div>
                <div style="font-size: 0.78rem; color: rgba(255,255,255,0.7); font-weight: 700;">En vivo</div>
            </div>
            <div id="total-likes">0</div>
        </div>
        <div id="likes-list"></div>
        <div id="empty-state">Esperando likes...</div>
    </main>

    <script>
        const socket = io();
        const list = document.getElementById('likes-list');
        const totalLikes = document.getElementById('total-likes');
        const emptyState = document.getElementById('empty-state');

        function changeTheme(color) {
            document.documentElement.style.setProperty('--neon-color', color);
            const r = parseInt(color.slice(1, 3), 16);
            const g = parseInt(color.slice(3, 5), 16);
            const b = parseInt(color.slice(5, 7), 16);
            document.documentElement.style.setProperty('--neon-glow', `rgba(${r}, ${g}, ${b}, 0.8)`);
        }

        function fallbackAvatar(name) {
            return `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(name || 'TikTok')}`;
        }

        function renderLikes(participants) {
            const sorted = Object.entries(participants || {})
                .map(([id, data]) => ({ id, ...data }))
                .sort((a, b) => (b.likes || 0) - (a.likes || 0))
                .slice(0, 3);

            emptyState.style.display = sorted.length ? 'none' : 'block';
            list.innerHTML = sorted.map((person, index) => `
                <div class="like-row" id="like-${person.id}">
                    <div class="rank">${index + 1}</div>
                    <img class="avatar" src="${person.photo || fallbackAvatar(person.name)}" alt="">
                    <div class="name">${person.name || person.id}</div>
                    <div class="likes">${person.likes || 0}</div>
                </div>
            `).join('');
        }

        socket.on('sync-state', (state) => {
            if (state.themeColor) changeTheme(state.themeColor);
            totalLikes.textContent = state.totalLikes || 0;
            renderLikes(state.likeParticipants || {});
        });

        socket.on('change-theme-broadcast', changeTheme);

        socket.on('likes-update', (data) => {
            totalLikes.textContent = data.totalLikes || 0;
            renderLikes(data.participants || {});
        });

        socket.on('clear-all-broadcast', () => {
            totalLikes.textContent = '0';
            renderLikes({});
        });

        socket.on('clear-likes-broadcast', () => {
            totalLikes.textContent = '0';
            renderLikes({});
        });
    </script>
</body>
</html>
