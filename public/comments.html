<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay comentarios</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/page-menu.js" defer></script>
    <style>
        :root {
            --cyan: #28f4ff;
            --pink: #ff3ca6;
            --gold: #ffd76a;
            --ink: rgba(5, 8, 22, 0.84);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: transparent;
            color: #fff;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
        }

        .comments-page {
            width: 100vw;
            min-height: 100vh;
            display: grid;
            align-items: end;
            justify-items: start;
            padding: 18px;
        }

        .comments-overlay {
            width: min(430px, calc(100vw - 24px));
            display: grid;
            gap: 8px;
        }

        .comment-card {
            display: grid;
            grid-template-columns: 40px 1fr;
            gap: 9px;
            align-items: start;
            min-height: 58px;
            padding: 8px 10px 8px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: linear-gradient(135deg, rgba(7, 9, 28, 0.9), rgba(24, 12, 38, 0.78));
            box-shadow: 0 0 18px rgba(40, 244, 255, 0.18), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            animation: enter 180ms ease-out;
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .avatar,
        .fallback-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.55);
            background: linear-gradient(135deg, var(--pink), var(--cyan));
            object-fit: cover;
            display: grid;
            place-items: center;
            color: #08101c;
            font-size: 0.88rem;
            font-weight: 1000;
        }

        .comment-body {
            min-width: 0;
            display: grid;
            gap: 3px;
        }

        .comment-name {
            color: var(--gold);
            font-size: 0.78rem;
            font-weight: 1000;
            line-height: 1.05;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(255, 215, 106, 0.35);
        }

        .comment-text {
            color: rgba(255, 255, 255, 0.94);
            font-size: 0.9rem;
            font-weight: 800;
            line-height: 1.16;
            overflow-wrap: anywhere;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.75);
        }

        .empty {
            width: min(300px, calc(100vw - 24px));
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.54);
            color: rgba(255, 255, 255, 0.74);
            font-size: 0.86rem;
            font-weight: 900;
            text-align: center;
        }

        .controls {
            position: fixed;
            right: 16px;
            bottom: 16px;
            width: min(340px, calc(100vw - 32px));
            display: grid;
            gap: 10px;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            background: rgba(0, 0, 0, 0.88);
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.7);
        }

        .field {
            display: grid;
            gap: 5px;
        }

        .field label {
            color: rgba(255, 255, 255, 0.76);
            font-size: 0.76rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            min-height: 38px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: #10131f;
            color: #fff;
            padding: 8px 10px;
            font: inherit;
            font-weight: 800;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            min-height: 38px;
            border: 0;
            border-radius: 6px;
            color: #071018;
            cursor: pointer;
            font: inherit;
            font-weight: 1000;
            text-transform: uppercase;
        }

        .send {
            background: #58ff9a;
        }

        .voice {
            background: var(--cyan);
        }

        .clear {
            background: #ff4d6d;
            color: #fff;
        }

        body:not(.control) .controls {
            display: none;
        }

        @media (max-width: 620px) {
            .comments-page {
                padding: 10px;
            }

            .comment-card {
                grid-template-columns: 34px 1fr;
            }

            .avatar,
            .fallback-avatar {
                width: 34px;
                height: 34px;
            }
        }
    </style>
</head>
<body>
    <main class="comments-page">
        <section class="comments-overlay" id="comments-list" aria-label="Comentarios del live"></section>
        <div class="empty" id="empty-state">Esperando comentarios...</div>
    </main>

    <aside class="controls" aria-label="Controles de comentarios">
        <div class="field">
            <label for="test-name">Nombre</label>
            <input id="test-name" type="text" value="Fan del live">
        </div>
        <div class="field">
            <label for="test-comment">Comentario</label>
            <input id="test-comment" type="text" value="Hola Esteban">
        </div>
        <div class="button-row">
            <button class="send" id="send-test-btn" type="button">Enviar prueba</button>
            <button class="voice" id="voice-btn" type="button">Voz on</button>
        </div>
        <div class="button-row">
            <button class="clear" id="clear-btn" type="button">Limpiar</button>
            <button class="voice" id="test-voice-btn" type="button">Probar voz</button>
        </div>
    </aside>

    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const isControl = params.get('control') === '1';
        let voiceEnabled = params.get('voice') === '1' || isControl;
        let bootstrapped = false;
        const knownIds = new Set();
        const spokenIds = new Set();

        const list = document.getElementById('comments-list');
        const emptyState = document.getElementById('empty-state');
        const voiceBtn = document.getElementById('voice-btn');

        if (isControl) {
            document.body.classList.add('control');
        }

        function initials(name) {
            return String(name || 'U').trim().slice(0, 2).toUpperCase();
        }

        function makeCard(comment) {
            const card = document.createElement('article');
            card.className = 'comment-card';

            if (comment.photo) {
                const img = document.createElement('img');
                img.className = 'avatar';
                img.src = comment.photo;
                img.alt = '';
                card.appendChild(img);
            } else {
                const fallback = document.createElement('div');
                fallback.className = 'fallback-avatar';
                fallback.textContent = initials(comment.name);
                card.appendChild(fallback);
            }

            const body = document.createElement('div');
            body.className = 'comment-body';

            const name = document.createElement('div');
            name.className = 'comment-name';
            name.textContent = comment.name || comment.uniqueId || 'Usuario';

            const text = document.createElement('div');
            text.className = 'comment-text';
            text.textContent = comment.text || '';

            body.append(name, text);
            card.appendChild(body);
            return card;
        }

        function render(comments) {
            const visible = (comments || []).slice(0, 5);
            emptyState.style.display = visible.length ? 'none' : 'block';
            list.replaceChildren(...visible.map(makeCard));
        }

        function speak(comment) {
            if (!voiceEnabled || !comment || spokenIds.has(comment.id) || !('speechSynthesis' in window)) return;
            spokenIds.add(comment.id);
            const name = comment.name || comment.uniqueId || 'Usuario';
            const utterance = new SpeechSynthesisUtterance(`${name} dice: ${comment.text}`);
            utterance.lang = 'es-ES';
            utterance.rate = 1;
            utterance.pitch = 1;
            window.speechSynthesis.speak(utterance);
        }

        function processComments(comments, newComment) {
            render(comments);

            if (!bootstrapped) {
                (comments || []).forEach((comment) => knownIds.add(comment.id));
                bootstrapped = true;
                if (newComment) speak(newComment);
                return;
            }

            if (newComment && !knownIds.has(newComment.id)) {
                knownIds.add(newComment.id);
                speak(newComment);
                return;
            }

            (comments || []).slice().reverse().forEach((comment) => {
                if (!knownIds.has(comment.id)) {
                    knownIds.add(comment.id);
                    speak(comment);
                }
            });
        }

        async function fetchComments() {
            try {
                const response = await fetch(`/api/comments?t=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) return;
                const data = await response.json();
                processComments(data.comments || []);
            } catch {
                // The next poll will retry.
            }
        }

        function updateVoiceButton() {
            if (voiceBtn) voiceBtn.textContent = voiceEnabled ? 'Voz on' : 'Voz off';
        }

        document.getElementById('send-test-btn')?.addEventListener('click', async () => {
            const body = {
                name: document.getElementById('test-name').value || 'Fan del live',
                text: document.getElementById('test-comment').value || 'Hola'
            };
            await fetch('/api/comments/test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                cache: 'no-store'
            }).catch(() => {});
        });

        document.getElementById('clear-btn')?.addEventListener('click', async () => {
            await fetch('/api/comments/clear', {
                method: 'POST',
                cache: 'no-store'
            }).catch(() => {});
        });

        document.getElementById('voice-btn')?.addEventListener('click', () => {
            voiceEnabled = !voiceEnabled;
            updateVoiceButton();
        });

        document.getElementById('test-voice-btn')?.addEventListener('click', () => {
            speak({
                id: `voice_test_${Date.now()}`,
                name: 'Prueba',
                text: 'La voz de comentarios esta funcionando'
            });
        });

        socket.on('sync-state', (state) => {
            processComments(state.comments || []);
        });

        socket.on('comments-update', (data) => {
            processComments(data.comments || [], data.newComment);
        });

        socket.on('comments-clear', () => {
            knownIds.clear();
            spokenIds.clear();
            bootstrapped = true;
            render([]);
        });

        updateVoiceButton();
        fetchComments();
        setInterval(fetchComments, 1000);
    </script>
</body>
</html>
