<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DONADORES OVERLAY - TikTok</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --neon-color: #bc13fe;
            --neon-glow: rgba(188, 19, 254, 0.8);
            --coin-gold: #ffd700;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: transparent;
            color: #fff;
            font-family: "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 12px;
            box-sizing: border-box;
        }

        #donors-box {
            width: 150px;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            padding: 0;
            box-sizing: border-box;
        }

        .header {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
            border-bottom: 0;
            padding-bottom: 0;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 16px var(--neon-color);
        }

        #top-amount {
            font-size: 1.7rem;
            font-weight: 900;
            color: var(--coin-gold);
            text-shadow: 0 0 18px var(--coin-gold);
            white-space: nowrap;
        }

        #donors-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .donor-card {
            position: relative;
            min-width: 0;
            display: grid;
            grid-template-columns: 35px 1fr;
            align-items: center;
            gap: 7px;
            min-height: 43px;
            padding: 4px 7px 4px 4px;
            border-radius: 4px;
            border: 1px solid rgba(255, 215, 0, 0.72);
            background: rgba(42, 42, 42, 0.82);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        .rank {
            position: absolute;
            left: 2px;
            bottom: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--coin-gold);
            color: #111;
            font-weight: 900;
            font-size: 0.55rem;
            box-shadow: 0 0 6px rgba(255, 215, 0, 0.75);
        }

        .donor-card:first-child {
            border-color: var(--coin-gold);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.42), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .donor-card:first-child .rank {
            background: var(--coin-gold);
            color: #111;
        }

        .avatar {
            grid-column: 1;
            grid-row: 1;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.85);
            object-fit: cover;
            background: #222;
        }

        .info {
            min-width: 0;
            grid-column: 2;
            grid-row: 1;
        }

        .name {
            font-weight: 900;
            font-size: 0.68rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.05;
        }

        .coins {
            margin-top: 2px;
            font-size: 0.7rem;
            font-weight: 900;
            color: var(--coin-gold);
            text-shadow: 0 0 7px rgba(255, 215, 0, 0.7);
        }

        #empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.72);
            font-weight: 800;
            padding: 46px 0 30px;
        }

        @media (max-width: 760px) {
            #donors-list {
                grid-template-columns: 1fr;
            }

            body {
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <main id="donors-box">
        <div class="header">
            <div>
                <div class="title">Top donadores</div>
                <div style="font-size: 0.78rem; color: rgba(255,255,255,0.7); font-weight: 700;">Personas que mas han donado</div>
            </div>
            <div id="top-amount">0 monedas</div>
        </div>
        <div id="donors-list"></div>
        <div id="empty-state">Esperando donaciones...</div>
    </main>

    <script>
        const socket = io();
        const list = document.getElementById('donors-list');
        const emptyState = document.getElementById('empty-state');
        const topAmount = document.getElementById('top-amount');

        function changeTheme(color) {
            document.documentElement.style.setProperty('--neon-color', color);
            const r = parseInt(color.slice(1, 3), 16);
            const g = parseInt(color.slice(3, 5), 16);
            const b = parseInt(color.slice(5, 7), 16);
            document.documentElement.style.setProperty('--neon-glow', `rgba(${r}, ${g}, ${b}, 0.8)`);
        }

        function fallbackAvatar(name) {
            return `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(name || 'Donador')}`;
        }

        function renderDonors(participants) {
            const sorted = Object.entries(participants || {})
                .map(([id, data]) => ({ id, ...data }))
                .sort((a, b) => (b.coins || 0) - (a.coins || 0))
                .slice(0, 3);

            emptyState.style.display = sorted.length ? 'none' : 'block';
            topAmount.textContent = sorted.length ? `${sorted[0].coins || 0} monedas` : '0 monedas';
            list.innerHTML = sorted.map((person, index) => `
                <div class="donor-card" id="donor-${person.id}">
                    <div class="rank">${index + 1}</div>
                    <img class="avatar" src="${person.photo || fallbackAvatar(person.name)}" alt="">
                    <div class="info">
                        <div class="name">${person.name || person.id}</div>
                        <div class="coins">${person.coins || 0} monedas</div>
                    </div>
                </div>
            `).join('');
        }

        socket.on('sync-state', (state) => {
            if (state.themeColor) changeTheme(state.themeColor);
            renderDonors(state.classicParticipants || {});
        });

        socket.on('change-theme-broadcast', changeTheme);

        socket.on('classic-update', (data) => {
            renderDonors(data.participants || {});
        });

        socket.on('clear-all-broadcast', () => {
            renderDonors({});
        });

        socket.on('clear-donors-broadcast', () => {
            renderDonors({});
        });
    </script>
</body>
</html>
