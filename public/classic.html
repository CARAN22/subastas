<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTROL PANEL CLÁSICO - TikTok Auction</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/page-menu.js" defer></script>
    <style>
        :root {
            --neon-color: #00ff00; /* Verde por defecto para diferenciar */
            --neon-glow: rgba(0, 255, 0, 0.8);
            --neon-bg: rgba(0, 255, 0, 0.15);
            --bg-dark: #000b1e; 
            --coin-gold: #ffd700;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #auction-box {
            width: 700px;
            height: 800px;
            background-color: transparent; /* TRANSPARENTE */
            border: 5px solid var(--neon-color);
            box-shadow: 0 0 40px var(--neon-glow), inset 0 0 60px var(--neon-glow);
            border-radius: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
            transform: scale(0.6);
            transform-origin: center center;
            animation: fire-border 2s infinite alternate;
        }

        @keyframes fire-border {
            0% { box-shadow: 0 0 20px var(--neon-glow), inset 0 0 20px var(--neon-glow); }
            100% { box-shadow: 0 0 40px var(--neon-color), 0 0 60px #ff0000, inset 0 0 40px var(--neon-color); }
        }

        #timer-container {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 3px solid var(--neon-color);
            padding-bottom: 10px;
        }

        #timer-label { font-size: 1.5rem; font-weight: bold; text-transform: uppercase; color: var(--neon-color); }
        #timer-display { font-size: 6rem; font-weight: 900; text-shadow: 0 0 20px var(--neon-color); font-family: 'Courier New', Courier, monospace; }
        
        #timer-display.delay-mode { color: #ff0000; text-shadow: 0 0 30px #ff0000; }

        #ranking-container { flex-grow: 1; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
        
        .rank-item {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid var(--neon-color);
            border-radius: 60px 20px 20px 60px;
            padding: 10px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .rank-item::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-25deg);
        }

        .rank-item.new-donation {
            transform: scale(1.1);
            border-color: #ffffff;
            box-shadow: 0 0 30px #ffffff;
        }

        .rank-item.new-donation::after {
            animation: shine 0.6s forwards;
        }

        @keyframes shine { 100% { left: 150%; } }

        .rank-number {
            width: 50px;
            height: 50px;
            background: var(--neon-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.5rem;
            margin-right: 15px;
            box-shadow: 0 0 15px var(--neon-color);
        }

        .rank-item:nth-child(1) { border-color: #ffd700; border-width: 4px; }
        .rank-item:nth-child(1) .rank-number { background: #ffd700; color: black; box-shadow: 0 0 20px #ffd700; }

        .rank-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
            margin-right: 20px;
        }

        .rank-info { flex-grow: 1; overflow: hidden; }
        .rank-name { font-size: 1.3rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .rank-coins { display: flex; align-items: center; color: var(--coin-gold); font-weight: 900; font-size: 1.8rem; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .coin-img { width: 28px; height: 28px; margin-right: 10px; }

        /* Pantalla Ganador Final en Panel */
        #winner-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            border-radius: 20px;
            animation: winner-zoom 0.5s forwards;
        }

        @keyframes winner-zoom { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .winner-title { font-size: 4rem; color: #ffd700; font-weight: 900; text-shadow: 0 0 30px #ffd700; margin-bottom: 30px; animation: pulse 1s infinite alternate; }
        .winner-avatar { width: 250px; height: 250px; border-radius: 50%; border: 8px solid #ffd700; box-shadow: 0 0 60px #ffd700; margin-bottom: 30px; }
        .winner-name { font-size: 3rem; font-weight: bold; color: white; text-shadow: 0 0 10px #ffd700; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* Estilo Panel de Ajustes */
        #config-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.95);
            padding: 25px;
            border-radius: 15px;
            border: 3px solid var(--neon-color);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 320px;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }

        .color-selector { display: flex; gap: 12px; margin: 5px 0; }
        .color-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid white; cursor: pointer; }
        input { background: #111; color: white; border: 2px solid #333; padding: 10px; border-radius: 8px; font-size: 1rem; }
        button.main-btn { cursor: pointer; padding: 12px; border-radius: 8px; border: none; background: var(--neon-color); color: white; font-weight: bold; font-size: 1rem; text-transform: uppercase; }
        label { font-size: 0.9rem; color: #ccc; font-weight: bold; }

        #links-panel { position: fixed; bottom: 20px; left: 20px; background: #000; padding: 15px; border: 1px solid #444; border-radius: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="config-panel">
        <h2 style="margin: 0; color: var(--neon-color); text-align: center; font-size: 1.2rem;">MODO SUBASTA CLÁSICA</h2>
        
        <label>COLOR NEÓN:</label>
        <div class="color-selector">
            <div class="color-btn" style="background: #00ff00;" onclick="sendTheme('#00ff00')"></div>
            <div class="color-btn" style="background: #bc13fe;" onclick="sendTheme('#bc13fe')"></div>
            <div class="color-btn" style="background: #ff0000;" onclick="sendTheme('#ff0000')"></div>
            <div class="color-btn" style="background: #00f2ea;" onclick="sendTheme('#00f2ea')"></div>
        </div>

        <label>USUARIO TIKTOK:</label>
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <input type="text" id="tiktok-username" placeholder="sin @">
            <div id="connection-status" style="font-size: 0.8rem; padding: 5px; border-radius: 5px; background: #333; text-align: center;">DESCONECTADO</div>
        </div>
        <button id="connect-btn" class="main-btn" style="background: #555;">CONECTAR TIKTOK</button>
        
        <label>TIEMPO INICIAL (SEG):</label>
        <input type="number" id="timer-init" value="60">

        <label>TIEMPO EXTRA (DELAY):</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="delay-time" value="10" style="flex-grow: 1;">
            <button id="confirm-delay-btn" style="background: var(--neon-color); color: black; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; padding: 0 10px;">OK</button>
        </div>
        
        <button id="start-manual-btn" class="main-btn" style="background: #4caf50;">INICIAR SUBASTA</button>
        <button id="clear-btn" class="main-btn" style="background: #cc0000;">LIMPIAR RANKING</button>
        <button id="test-btn" class="main-btn" style="background: #333;">TEST: DONAR 10 ROSAS</button>
        <button id="test-big-btn" class="main-btn" style="background: #333;">TEST: DONAR 500 COINS</button>
    </div>

    <div id="auction-box">
        <div id="timer-display">00:00</div>
        <div id="ranking-container"></div>
    </div>

    <script>
        const socket = io();
        let timeLeft = 0;
        let timerInterval = null;
        let isAuctionActive = false;

        const container = document.getElementById('ranking-container');
        const timerDisplay = document.getElementById('timer-display');

        // Configurar modo al cargar la página
        socket.emit('set-mode', 'classic');

        function sendTheme(color) {
            socket.emit('admin-change-theme', color);
        }

        function createRandomTestDonor(totalCoins) {
            const names = ['Luna Vega', 'Max Rider', 'Sofia Nova', 'Alex Byte', 'Mia Flow', 'Nico Star', 'Emma Lux', 'Leo Beats'];
            const handles = ['luna_live', 'maxdrops', 'sofi_gifts', 'alexbyte', 'miaflow', 'nicostar', 'emmalux', 'leobeats'];
            const index = Math.floor(Math.random() * names.length);
            const suffix = Math.floor(Math.random() * 9000 + 1000);
            const handle = `${handles[index]}_${suffix}`;

            return {
                uniqueId: `test_${handle}`,
                nickname: `${names[index]} (@${handle})`,
                profilePictureUrl: `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(names[index])}`,
                totalCoins
            };
        }

        socket.on('change-theme-broadcast', (color) => {
            document.documentElement.style.setProperty('--neon-color', color);
            const r = parseInt(color.slice(1,3), 16);
            const g = parseInt(color.slice(3,5), 16);
            const b = parseInt(color.slice(5,7), 16);
            document.documentElement.style.setProperty('--neon-glow', `rgba(${r}, ${g}, ${b}, 0.8)`);
            document.documentElement.style.setProperty('--neon-bg', `rgba(${r}, ${g}, ${b}, 0.15)`);
        });

        document.getElementById('connect-btn').addEventListener('click', () => {
            const user = document.getElementById('tiktok-username').value.trim();
            if (user) socket.emit('set-tiktok-user', user);
        });

        socket.on('tiktok-connecting', (username) => {
            const statusEl = document.getElementById('connection-status');
            statusEl.textContent = 'CONECTANDO: ' + username;
            statusEl.style.background = '#d97706';
        });

        socket.on('tiktok-error', (message) => {
            const statusEl = document.getElementById('connection-status');
            statusEl.textContent = message;
            statusEl.style.background = '#cc0000';
        });

        socket.on('tiktok-disconnected', () => {
            const statusEl = document.getElementById('connection-status');
            statusEl.textContent = 'DESCONECTADO';
            statusEl.style.background = '#cc0000';
        });

        document.getElementById('confirm-delay-btn').addEventListener('click', () => {
            const val = parseInt(document.getElementById('delay-time').value);
            socket.emit('set-delay-time', val);
            alert("Tiempo de delay configurado: " + val + " seg");
        });

        document.getElementById('start-manual-btn').addEventListener('click', () => {
            const time = parseInt(document.getElementById('timer-init').value);
            const delay = parseInt(document.getElementById('delay-time').value);
            socket.emit('admin-start-auction', { initTime: time, delayTime: delay });
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            socket.emit('admin-clear-all');
        });

        document.getElementById('test-btn').addEventListener('click', () => {
            // Simular 10 rosas (10 coins)
            socket.emit('admin-add-classic-test', createRandomTestDonor(10));
        });

        document.getElementById('test-big-btn').addEventListener('click', () => {
            // Simular 500 coins
            socket.emit('admin-add-classic-test', createRandomTestDonor(500));
        });

        socket.on('sync-state', (state) => {
            const statusEl = document.getElementById('connection-status');
            if (state.isConnected) {
                statusEl.textContent = "CONECTADO: " + state.tiktokUser;
                statusEl.style.background = "#4caf50";
            }
            if (state.themeColor) sendTheme(state.themeColor);
        });

        socket.on('start-auction-broadcast', (config) => {
            isAuctionActive = true;
            timeLeft = config.initTime;
            updateTimerDisplay();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft > 0) { timeLeft--; updateTimerDisplay(); }
                else { clearInterval(timerInterval); isAuctionActive = false; }
            }, 1000);
        });

        socket.on('classic-update', (data) => {
            if (isAuctionActive) {
                timeLeft += data.extraTime;
                updateTimerDisplay();
            }
            renderRanking(data.participants);
        });

        socket.on('clear-all-broadcast', () => {
            container.innerHTML = "";
            timeLeft = 0;
            updateTimerDisplay();
            clearInterval(timerInterval);
            isAuctionActive = false;
        });

        function renderRanking(participantsMap) {
            const sorted = Object.entries(participantsMap)
                .map(([id, data]) => ({ id, ...data }))
                .sort((a, b) => b.coins - a.coins)
                .slice(0, 10);

            container.innerHTML = sorted.map((p, index) => `
                <div class="rank-item">
                    <div class="rank-number">${index + 1}</div>
                    <img src="${p.photo}" class="rank-avatar">
                    <div class="rank-info">
                        <div class="rank-name">${p.name}</div>
                        <div class="rank-coins">
                            <img src="https://p16-va.lemoncdn.com/obj/musically-maliva-obj/0b904d093510e1320158485292a18837" class="coin-img">
                            <span>${p.coins}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerDisplay.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }
    </script>
</body>
</html>
