<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASSIC AUCTION - TikTok</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/page-menu.js" defer></script>
    <style>
        :root {
            --neon-color: #bc13fe; 
            --neon-glow: rgba(188, 19, 254, 0.8);
            --neon-bg: rgba(188, 19, 254, 0.32);
            --coin-gold: #ffd700;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: transparent; 
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #auction-box {
            width: 350px;
            height: 450px;
            background-color: var(--neon-bg);
            border: 3px solid var(--neon-color);
            box-shadow: 0 0 30px var(--neon-glow), inset 0 0 40px var(--neon-glow);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            /* backdrop-filter quitado a petición del usuario */
            position: relative;
            animation: fire-border 2s infinite alternate;
        }

        @keyframes fire-border {
            0% { box-shadow: 0 0 20px var(--neon-glow), inset 0 0 20px var(--neon-glow); }
            100% { box-shadow: 0 0 40px var(--neon-color), 0 0 60px #ff0000, inset 0 0 40px var(--neon-color); }
        }

        #timer-container {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 3px solid var(--neon-color);
            padding-bottom: 10px;
        }

        #timer-label { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; color: var(--neon-color); }
        #timer-display { font-size: 3rem; font-weight: 900; text-shadow: 0 0 20px var(--neon-color); font-family: 'Courier New', Courier, monospace; }
        
        #timer-display.delay-mode { color: #ff0000; text-shadow: 0 0 30px #ff0000; }

        #ranking-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .rank-item {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid var(--neon-color);
            border-radius: 60px 20px 20px 60px;
            padding: 10px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Efecto de Limpieza (Shine) */
        .rank-item::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-25deg);
        }

        .rank-item.new-donation {
            transform: scale(1.1);
            border-color: #ffffff;
            box-shadow: 0 0 30px #ffffff;
        }

        .rank-item.new-donation::after {
            animation: shine 0.6s forwards;
        }

        @keyframes shine {
            100% { left: 150%; }
        }

        .rank-number {
            width: 35px;
            height: 35px;
            background: var(--neon-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1rem;
            margin-right: 8px;
            box-shadow: 0 0 15px var(--neon-color);
        }

        .rank-item:nth-child(1) { border-color: #ffd700; border-width: 4px; }
        .rank-item:nth-child(1) .rank-number { background: #ffd700; color: black; box-shadow: 0 0 20px #ffd700; }

        .rank-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
            margin-right: 10px;
        }

        .rank-info { flex-grow: 1; overflow: hidden; }
        .rank-name { font-size: 0.9rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .rank-coins { display: flex; align-items: center; color: var(--coin-gold); font-weight: 900; font-size: 1.1rem; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .coin-img { width: 18px; height: 18px; margin-right: 5px; }

        /* Pantalla Ganador Final */
        #winner-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            border-radius: 20px;
            animation: winner-zoom 0.5s forwards;
        }

        @keyframes winner-zoom { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .winner-title { font-size: 4rem; color: #ffd700; font-weight: 900; text-shadow: 0 0 30px #ffd700; margin-bottom: 30px; animation: pulse 1s infinite alternate; }
        .winner-avatar { width: 250px; height: 250px; border-radius: 50%; border: 8px solid #ffd700; box-shadow: 0 0 60px #ffd700; margin-bottom: 30px; }
        .winner-name { font-size: 3rem; font-weight: bold; color: white; text-shadow: 0 0 10px #ffd700; }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

    <div id="auction-box">
        <div id="timer-container">
            <div id="timer-label">TIEMPO RESTANTE</div>
            <div id="timer-display">00:00</div>
        </div>
        
        <div id="ranking-container">
            <!-- Solo Top 3 -->
        </div>

        <div id="winner-screen">
            <div class="winner-title">¡GANADOR!</div>
            <img src="" class="winner-avatar" id="w-avatar">
            <div class="winner-name" id="w-name">NOMBRE</div>
        </div>
    </div>

    <script>
        const socket = io();
        let timeLeft = 0;
        let delayLeft = 0;
        let timerInterval = null;
        let isAuctionActive = false;
        let isDelayMode = false;

        const container = document.getElementById('ranking-container');
        const timerDisplay = document.getElementById('timer-display');
        const timerLabel = document.getElementById('timer-label');
        const winnerScreen = document.getElementById('winner-screen');

        function changeTheme(color) {
            document.documentElement.style.setProperty('--neon-color', color);
            const r = parseInt(color.slice(1,3), 16);
            const g = parseInt(color.slice(3,5), 16);
            const b = parseInt(color.slice(5,7), 16);
            document.documentElement.style.setProperty('--neon-glow', `rgba(${r}, ${g}, ${b}, 0.8)`);
            document.documentElement.style.setProperty('--neon-bg', `rgba(${r}, ${g}, ${b}, 0.32)`);
        }

        socket.on('sync-state', (state) => {
            if (state.themeColor) changeTheme(state.themeColor);
        });

        socket.on('change-theme-broadcast', changeTheme);

        socket.on('start-auction-broadcast', (config) => {
            isAuctionActive = true;
            isDelayMode = false;
            winnerScreen.style.display = 'none';
            timeLeft = config.initTime;
            delayLeft = config.delayTime || 10;
            currentDelayConfig = delayLeft; // Guardar para desempates
            
            timerLabel.textContent = "TIEMPO RESTANTE";
            timerDisplay.classList.remove('delay-mode');
            updateTimerDisplay(timeLeft);
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isDelayMode) {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerDisplay(timeLeft);
                    } else {
                        startDelayMode();
                    }
                } else {
                    if (delayLeft > 0) {
                        delayLeft--;
                        updateTimerDisplay(delayLeft);
                    } else {
                        // REVISAR EMPATE ANTES DE FINALIZAR
                        checkTieAndFinish();
                    }
                }
            }, 1000);
        });

        let currentDelayConfig = 10;
        let lastSortedParticipants = [];

        function checkTieAndFinish() {
            if (lastSortedParticipants.length >= 2) {
                const first = lastSortedParticipants[0];
                const second = lastSortedParticipants[1];
                
                if (first.coins === second.coins) {
                    // HAY EMPATE: Reiniciar delay
                    console.log("¡Empate detectado! Reiniciando delay...");
                    delayLeft = currentDelayConfig;
                    updateTimerDisplay(delayLeft);
                    return;
                }
            }
            
            clearInterval(timerInterval);
            finishAuction();
        }

        function startDelayMode() {
            isDelayMode = true;
            timerLabel.textContent = "¡DELAY FINAL!";
            timerDisplay.classList.add('delay-mode');
            updateTimerDisplay(delayLeft);
        }

        socket.on('classic-update', (data) => {
            renderRanking(data.participants, data.newDonationId);
        });

        socket.on('clear-all-broadcast', () => {
            isAuctionActive = false;
            container.innerHTML = "";
            winnerScreen.style.display = 'none';
            timeLeft = 0;
            lastSortedParticipants = [];
            updateTimerDisplay(0);
        });

        function renderRanking(participantsMap, highlightId) {
            const sorted = Object.entries(participantsMap)
                .map(([id, data]) => ({ id, ...data }))
                .sort((a, b) => b.coins - a.coins);
            
            lastSortedParticipants = sorted; // Guardar para checkTie
            
            const top3 = sorted.slice(0, 3); // SOLO TOP 3 visualmente

            container.innerHTML = top3.map((p, index) => {
                const isNew = p.id === highlightId;
                return `
                    <div class="rank-item ${isNew ? 'new-donation' : ''}" id="rank-${p.id}">
                        <div class="rank-number">${index + 1}</div>
                        <img src="${p.photo}" class="rank-avatar">
                        <div class="rank-info">
                            <div class="rank-name">${p.name}</div>
                            <div class="rank-coins">
                                <img src="https://p16-va.lemoncdn.com/obj/musically-maliva-obj/0b904d093510e1320158485292a18837" class="coin-img">
                                <span>${p.coins}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Quitar clase de animación después de un momento
            if (highlightId) {
                setTimeout(() => {
                    const el = document.getElementById(`rank-${highlightId}`);
                    if (el) el.classList.remove('new-donation');
                }, 1000);
            }
        }

        function updateTimerDisplay(time) {
            const m = Math.floor(time / 60);
            const s = time % 60;
            timerDisplay.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function finishAuction() {
            isAuctionActive = false;
            const first = container.querySelector('.rank-item:nth-child(1)');
            if (first) {
                const name = first.querySelector('.rank-name').textContent;
                const photo = first.querySelector('.rank-avatar').src;
                document.getElementById('w-name').textContent = name;
                document.getElementById('w-avatar').src = photo;
                winnerScreen.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
