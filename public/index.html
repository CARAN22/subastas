<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTROL PANEL - TikTok Auction</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --neon-color: #bc13fe; 
            --neon-glow: rgba(188, 19, 254, 0.8);
            --neon-bg: rgba(188, 19, 254, 0.15);
            --bg-dark: #000b1e; /* AZUL FONDO CONTROL PANEL */
            --coin-gold: #ffd700;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Reutilizamos el estilo del cuadro para previsualizar en el panel */
        #auction-box {
            width: 950px;
            height: 700px;
            background-color: var(--neon-bg);
            border: 5px solid var(--neon-color);
            box-shadow: 0 0 40px var(--neon-glow), inset 0 0 60px var(--neon-glow);
            border-radius: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
            transform: scale(0.8); /* Previsualización más pequeña */
        }

        #header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--neon-color); padding-bottom: 15px; margin-bottom: 25px; }
        #timer-display { font-size: 7rem; font-weight: 900; text-shadow: 0 0 20px var(--neon-color); font-family: 'Courier New', Courier, monospace; }
        #timer-display.danger { color: #ff0000; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        #stats { text-align: right; font-size: 2rem; font-weight: bold; display: flex; flex-direction: column; gap: 10px; }
        #stats div { background: rgba(0, 0, 0, 0.5); padding: 5px 15px; border-radius: 10px; border: 1px solid var(--neon-color); }
        #participants-container { flex-grow: 1; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 10px; overflow: hidden; padding: 15px; }
        
        .participant { background: rgba(0, 0, 0, 0.6); border: 2px solid var(--neon-color); border-radius: 10px; display: flex; flex-direction: column; align-items: center; overflow: hidden; width: 180px; height: 200px; }
        .participant img.avatar { width: 100%; height: 70%; object-fit: cover; }
        .participant-info { width: 100%; height: 30%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.8); }
        .participant .name { font-size: 0.8rem; font-weight: bold; text-align: center; }
        .participant .coins-container { display: flex; align-items: center; color: var(--coin-gold); font-weight: 900; font-size: 1rem; }
        .coin-img { width: 18px; height: 18px; margin-right: 4px; }

        /* Panel de Configuración siempre visible en este archivo */
        #config-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.95);
            padding: 25px;
            border-radius: 15px;
            border: 3px solid var(--neon-color);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 300px;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }

        .color-selector { display: flex; gap: 12px; margin: 5px 0; }
        .color-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid white; cursor: pointer; }
        input { background: #111; color: white; border: 2px solid #333; padding: 10px; border-radius: 8px; font-size: 1rem; }
        button.main-btn { cursor: pointer; padding: 12px; border-radius: 8px; border: none; background: var(--neon-color); color: white; font-weight: bold; font-size: 1rem; text-transform: uppercase; }
        label { font-size: 0.9rem; color: #ccc; font-weight: bold; }
        .hidden { display: none !important; }

        #links-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.95);
            padding: 18px;
            border: 2px solid var(--neon-color);
            border-radius: 10px;
            width: 280px;
            box-shadow: 0 0 24px rgba(0,0,0,0.9);
        }

        #links-panel h3 {
            margin: 0 0 12px;
            font-size: 0.95rem;
            text-transform: uppercase;
        }

        .page-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            min-height: 42px;
            margin-top: 8px;
            padding: 10px 12px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.22);
            background: #151515;
            color: #fff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 800;
        }

        .page-link:hover {
            border-color: var(--neon-color);
            box-shadow: 0 0 14px var(--neon-glow);
        }

        .page-link code {
            color: var(--coin-gold);
            font-size: 0.72rem;
            font-weight: 700;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="config-panel">
        <label>MODO DE JUEGO:</label>
        <select id="game-mode" style="background: #222; color: white; padding: 8px; border-radius: 5px; border: 1px solid var(--neon-color);">
            <option value="elimination">ELIMINACIÓN (CUADROS)</option>
            <option value="classic">SUBASTA CLÁSICA (RANKING)</option>
        </select>

        <div id="classic-settings" class="hidden">
            <label>SEG. EXTRA POR MONEDA:</label>
            <input type="number" id="extra-time" value="1">
            <br>â€¢ Likes: <code>/likes.html</code><br>
            â€¢ Top donadores: <code>/donors.html</code>
        </div>

        <label>COLOR NEÓN:</label>
        <div class="color-selector">
            <div class="color-btn" style="background: #bc13fe;" onclick="sendTheme('#bc13fe')"></div>
            <div class="color-btn" style="background: #00ff00;" onclick="sendTheme('#00ff00')"></div>
            <div class="color-btn" style="background: #ff0000;" onclick="sendTheme('#ff0000')"></div>
            <div class="color-btn" style="background: #00f2ea;" onclick="sendTheme('#00f2ea')"></div>
        </div>

        <label>USUARIO TIKTOK:</label>
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <input type="text" id="tiktok-username" placeholder="sin @">
            <div id="connection-status" style="font-size: 0.8rem; padding: 5px; border-radius: 5px; background: #333; text-align: center;">DESCONECTADO</div>
        </div>
        <button id="connect-btn" class="main-btn" style="background: #555;">CONECTAR TIKTOK</button>
        
        <label>MÍNIMO MONEDAS:</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="min-coins" value="100" style="flex-grow: 1;">
            <button id="confirm-min-btn" style="background: var(--coin-gold); color: black; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; padding: 0 10px;">OK</button>
        </div>
        
        <label>TIEMPO INICIAL (SEG):</label>
        <input type="number" id="timer-init" value="60">
        
        <label>INTERVALO ELIMINACIÓN (SEG):</label>
        <input type="number" id="elim-interval" value="10">
        
        <button id="start-manual-btn" class="main-btn" style="background: #4caf50;">INICIAR CRONÓMETRO</button>
        <button id="clear-btn" class="main-btn" style="background: #cc0000;">LIMPIAR TODO</button>
        <button id="clear-donors-btn" class="main-btn" style="background: #7c4dff;">LIMPIAR TOP DONADORES</button>
        <button id="clear-likes-btn" class="main-btn" style="background: #ff0050;">LIMPIAR TOP LIKES</button>
        <button id="test-btn" class="main-btn" style="background: #333;">AÑADIR TEST</button>
        <button id="test-donor-btn" class="main-btn" style="background: #7c4dff;">TEST DONACION</button>
        <button id="test-like-btn" class="main-btn" style="background: #ff0050;">TEST LIKES</button>
        <button id="test-time-btn" class="main-btn" style="background: #ffa500; color: black;">FORZAR 10S</button>
        <button id="test-elim-btn" class="main-btn" style="background: #ff0050;">ELIMINAR YA</button>
    </div>

    <div id="auction-box">
        <div id="header">
            <div id="timer-display">00:00</div>
            <div id="stats">
                <div id="min-label">MÍNIMO: 100 <img src="https://p16-va.lemoncdn.com/obj/musically-maliva-obj/0b904d093510e1320158485292a18837" class="coin-img"></div>
                <div id="count-label">PARTICIPANTES: 0</div>
            </div>
        </div>
        <div id="participants-container"></div>
    </div>

    <nav id="links-panel" aria-label="Paginas y overlays">
        <h3>Entrar a paginas</h3>
        <a class="page-link" href="/overlay.html" target="_blank" rel="noopener">
            <span>Overlay eliminacion</span>
            <code>/overlay.html</code>
        </a>
        <a class="page-link" href="/auction.html" target="_blank" rel="noopener">
            <span>Overlay clasico</span>
            <code>/auction.html</code>
        </a>
        <a class="page-link" href="/classic.html" target="_blank" rel="noopener">
            <span>Subasta clasica</span>
            <code>/classic.html</code>
        </a>
        <a class="page-link" href="/likes.html" target="_blank" rel="noopener">
            <span>Likes</span>
            <code>/likes.html</code>
        </a>
        <a class="page-link" href="/donors.html" target="_blank" rel="noopener">
            <span>Top donadores</span>
            <code>/donors.html</code>
        </a>
    </nav>

    <script>
        const socket = io();
        document.getElementById('classic-settings').innerHTML = '<label>SEG. EXTRA POR MONEDA:</label><input type="number" id="extra-time" value="1">';
        let participants = [];
        let timeLeft = 0;
        let initTimeConfig = 60;
        let timerInterval = null;
        let isAuctionActive = false;
        let hasWinner = false;

        const container = document.getElementById('participants-container');
        const timerDisplay = document.getElementById('timer-display');
        const countLabel = document.getElementById('count-label');
        const minLabel = document.getElementById('min-label');

        function sendTheme(color) {
            socket.emit('admin-change-theme', color);
        }

        socket.on('sync-state', (state) => {
            document.documentElement.style.setProperty('--neon-color', state.themeColor);
            if (state.minCoins) {
                document.getElementById('min-coins').value = state.minCoins;
                minLabel.innerHTML = `MÍNIMO: ${state.minCoins} <img src="https://p16-va.lemoncdn.com/obj/musically-maliva-obj/0b904d093510e1320158485292a18837" class="coin-img">`;
            }
            
            const statusEl = document.getElementById('connection-status');
            if (state.isConnected) {
                statusEl.textContent = "CONECTADO: " + state.tiktokUser;
                statusEl.style.background = "#4caf50";
            } else {
                statusEl.textContent = "DESCONECTADO";
                statusEl.style.background = "#cc0000";
            }
        });

        socket.on('update-min-broadcast', (min) => {
            document.getElementById('min-coins').value = min;
            minLabel.innerHTML = `MÍNIMO: ${min} <img src="https://p16-va.lemoncdn.com/obj/musically-maliva-obj/0b904d093510e1320158485292a18837" class="coin-img">`;
        });

        socket.on('change-theme-broadcast', (color) => {
            document.documentElement.style.setProperty('--neon-color', color);
            const r = parseInt(color.slice(1,3), 16);
            const g = parseInt(color.slice(3,5), 16);
            const b = parseInt(color.slice(5,7), 16);
            document.documentElement.style.setProperty('--neon-glow', `rgba(${r}, ${g}, ${b}, 0.8)`);
            document.documentElement.style.setProperty('--neon-bg', `rgba(${r}, ${g}, ${b}, 0.15)`);
        });

        document.getElementById('game-mode').addEventListener('change', (e) => {
            const mode = e.target.value;
            socket.emit('set-mode', mode);
            document.getElementById('classic-settings').classList.toggle('hidden', mode !== 'classic');
        });

        document.getElementById('extra-time').addEventListener('input', (e) => {
            socket.emit('set-extra-time', parseInt(e.target.value) || 0);
        });

        document.getElementById('connect-btn').addEventListener('click', () => {
            const user = document.getElementById('tiktok-username').value.trim();
            if (user) socket.emit('set-tiktok-user', user);
        });

        document.getElementById('confirm-min-btn').addEventListener('click', () => {
            const min = parseInt(document.getElementById('min-coins').value);
            socket.emit('admin-update-min', min);
            alert("Mínimo confirmado: " + min);
        });

        document.getElementById('start-manual-btn').addEventListener('click', () => {
            const time = parseInt(document.getElementById('timer-init').value);
            const min = parseInt(document.getElementById('min-coins').value);
            socket.emit('admin-start-auction', { 
                initTime: time,
                minCoins: min 
            });
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            socket.emit('admin-clear-all');
        });

        document.getElementById('clear-donors-btn').addEventListener('click', () => {
            socket.emit('admin-clear-donors');
        });

        document.getElementById('clear-likes-btn').addEventListener('click', () => {
            socket.emit('admin-clear-likes');
        });

        document.getElementById('test-btn').addEventListener('click', () => {
            const id = 'test_' + Math.floor(Math.random()*9999);
            socket.emit('admin-add-test', { id, name: 'Usuario '+id.split('_')[1], photo: 'https://p16-amd-va.tiktokcdn.com/img/musically-maliva-obj/1594805258216454~c5_100x100.jpeg', coins: 100 });
        });

        document.getElementById('test-donor-btn').addEventListener('click', () => {
            const id = 'donor_' + Math.floor(Math.random()*5 + 1);
            socket.emit('admin-add-classic-test', {
                uniqueId: id,
                nickname: 'Donador ' + id.split('_')[1],
                profilePictureUrl: 'https://p16-amd-va.tiktokcdn.com/img/musically-maliva-obj/1594805258216454~c5_100x100.jpeg',
                totalCoins: Math.floor(Math.random()*500 + 50)
            });
        });

        document.getElementById('test-like-btn').addEventListener('click', () => {
            const id = 'like_' + Math.floor(Math.random()*5 + 1);
            socket.emit('admin-add-like-test', {
                uniqueId: id,
                nickname: 'Fan ' + id.split('_')[1],
                profilePictureUrl: 'https://p16-amd-va.tiktokcdn.com/img/musically-maliva-obj/1594805258216454~c5_100x100.jpeg',
                likeCount: Math.floor(Math.random()*30 + 1)
            });
        });

        document.getElementById('test-time-btn').addEventListener('click', () => {
            socket.emit('admin-force-time', 10);
        });

        document.getElementById('test-elim-btn').addEventListener('click', () => {
            socket.emit('admin-trigger-elimination');
        });

        // Sincronización de vista en el panel
        socket.on('start-auction-broadcast', (config) => {
            initTimeConfig = config.initTime;
            isAuctionActive = true;
            hasWinner = false;
            startAuction(initTimeConfig);
        });

        socket.on('clear-all-broadcast', () => {
            participants = [];
            container.innerHTML = "";
            isAuctionActive = false;
            hasWinner = false;
            timeLeft = 0;
            clearInterval(timerInterval);
            updateTimerDisplay();
            countLabel.textContent = "PARTICIPANTES: 0";
        });

        socket.on('add-participant-broadcast', (data) => {
            addParticipant(data.id, data.name, data.photo, data.coins);
        });

        socket.on('force-time-broadcast', (t) => { timeLeft = t; updateTimerDisplay(); });

        function startAuction(seconds) {
            clearInterval(timerInterval);
            timeLeft = seconds;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (timeLeft > 0) { timeLeft--; updateTimerDisplay(); }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerDisplay.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            if (timeLeft <= 10 && timeLeft > 0) timerDisplay.classList.add('danger');
            else timerDisplay.classList.remove('danger');
        }

        function addParticipant(id, name, photo, coins) {
            const div = document.createElement('div');
            div.className = 'participant';
            div.id = `p-${id}`;
            div.innerHTML = `<img src="${photo}" class="avatar"><div class="participant-info"><div class="name">${name}</div><div class="coins-container"><img src="https://p16-va.lemoncdn.com/obj/musically-maliva-obj/0b904d093510e1320158485292a18837" class="coin-img"><span>${coins}</span></div></div>`;
            container.appendChild(div);
            participants.push({id});
            countLabel.textContent = `PARTICIPANTES: ${participants.length}`;
            adjustSizes(); // Añadir esto para que se ajusten en el panel también
        }

        function adjustSizes() {
            const count = participants.length;
            document.querySelectorAll('.participant').forEach(card => {
                card.classList.remove('size-sm', 'size-xs', 'size-xxs');
                if (count > 30) card.classList.add('size-xxs');
                else if (count > 20) card.classList.add('size-xs');
                else if (count > 10) card.classList.add('size-sm');
            });
        }
    </script>
</body>
</html>
