<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subastini | Iniciar sesión</title>
    <style>
        :root { color-scheme: dark; font-family: Arial, sans-serif; background: #101018; color: #fff; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #2a1635, #101018 55%); }
        main { width: min(100%, 390px); padding: 32px; border: 1px solid #56366b; border-radius: 12px; background: #181420; box-shadow: 0 18px 60px #0008; }
        h1 { margin: 0 0 8px; color: #f4b8ff; font-size: 28px; }
        p { margin: 0 0 26px; color: #bdb4c4; }
        label { display: block; margin: 16px 0 7px; color: #eee; font-size: 14px; }
        input, button { width: 100%; min-height: 46px; border-radius: 7px; font: inherit; }
        input { border: 1px solid #594764; padding: 0 13px; background: #0f0c14; color: #fff; }
        input:focus { outline: 2px solid #d55cff; border-color: transparent; }
        button { margin-top: 24px; border: 0; background: #d04cff; color: #180d1d; font-weight: 700; cursor: pointer; }
        button:hover { background: #e18aff; }
        #error { min-height: 20px; margin-top: 14px; color: #ff8e9c; font-size: 14px; }
    </style>
</head>
<body>
    <main>
        <h1>Subastini</h1>
        <p>Inicia sesión para abrir tu panel y tus overlays.</p>
        <form id="login-form">
            <label for="username">Usuario</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Iniciar sesión</button>
            <div id="error" role="alert"></div>
        </form>
    </main>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const error = document.getElementById('error');
            error.textContent = '';
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            if (response.ok) window.location.href = '/index.html';
            else error.textContent = 'Usuario o contraseña incorrectos.';
        });
    </script>
</body>
</html>
